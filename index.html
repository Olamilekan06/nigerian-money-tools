<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NaijaNumber | US & Canada Numbers</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 6px;
    }

    header p {
      color: #d1d5db;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 16px;
    }

    .hero {
      background: white;
      border-radius: 14px;
      padding: 25px;
      margin-bottom: 20px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .hero h2 {
      margin-bottom: 10px;
    }

    .hero p {
      color: #6b7280;
    }

    .plans {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .plan {
      background: white;
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .plan h3 {
      margin-bottom: 10px;
    }

    .country {
      color: #6b7280;
      margin-bottom: 12px;
    }

    .price {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 13px;
      background: #0b8f55;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #087746;
    }

    .form-box {
      display: none;
      background: white;
      margin-top: 25px;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .form-box h2 {
      margin-bottom: 18px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    footer {
      text-align: center;
      padding: 30px 15px;
      color: #6b7280;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  <h1>NaijaNumber</h1>
  <p>US & Canada virtual numbers</p>
</header>

<div class="container">

  <div class="hero">
    <h2>Choose Your Number Plan</h2>
    <p>Get a US or Canada number and manage your order online.</p>
  </div>

  <div class="plans">

    <div class="plan">
      <h3>US Number</h3>
      <div class="country">🇺🇸 United States</div>
      <div class="price">₦1,000</div>
      <button onclick="selectPlan('US Number - 7 Days', 1000)">
        Get US Number
      </button>
    </div>

    <div class="plan">
      <h3>Canada Number</h3>
      <div class="country">🇨🇦 Canada</div>
      <div class="price">₦1,500</div>
      <button onclick="selectPlan('Canada Number - 7 Days', 1500)">
        Get Canada Number
      </button>
    </div>

  </div>

  <div class="form-box" id="orderBox">
    <h2>Complete Your Order</h2>

    <input
      type="text"
      id="name"
      placeholder="Your full name"
    >

    <input
      type="email"
      id="email"
      placeholder="Your email address"
    >

    <input
      type="tel"
      id="phone"
      placeholder="Your phone number"
    >

    <input
      type="text"
      id="selectedPlan"
      readonly
    >

    <input
      type="text"
      id="selectedPrice"
      readonly
    >

    <button onclick="submitOrder()">
      Continue
    </button>

    <div id="message" class="message"></div>
  </div>

</div>

<footer>
  © 2026 NaijaNumber. All rights reserved.
</footer>

<script>

  const SUPABASE_URL =
    "https://ircehxmzocvgbkejnubm.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_OhSR_3jGbyIsHD2Hq-TDog_bXqqH559";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  let selectedPlan = "";
  let selectedPrice = 0;

  function selectPlan(plan, price) {

    selectedPlan = plan;
    selectedPrice = price;

    document.getElementById("selectedPlan").value = plan;

    document.getElementById("selectedPrice").value =
      "₦" + price.toLocaleString();

    document.getElementById("orderBox").style.display = "block";

    document.getElementById("orderBox").scrollIntoView({
      behavior: "smooth"
    });
  }

  async function submitOrder() {

    const name =
      document.getElementById("name").value.trim();

    const email =
      document.getElementById("email").value.trim();

    const phone =
      document.getElementById("phone").value.trim();

    const message =
      document.getElementById("message");

    message.style.display = "none";
    message.className = "message";

    if (!name || !email || !phone) {

      message.textContent =
        "Please fill in all the fields.";

      message.classList.add("error");
      message.style.display = "block";

      return;
    }

    message.textContent =
      "Submitting your order...";

    message.className = "message success";
    message.style.display = "block";

    const { error } =
      await supabaseClient
        .from("orders")
        .insert([
          {
            name: name,
            email: email,
            phone: phone,
            plan: selectedPlan,
            price: selectedPrice,
            status: "pending"
          }
        ]);

    if (error) {

      console.error(error);

      message.textContent =
        "Your order could not be submitted yet. Please try again.";

      message.className = "message error";
      message.style.display = "block";

      return;
    }

    message.textContent =
      "Order received successfully! We will process your order.";

    message.className = "message success";
    message.style.display = "block";
  }

</script>

</body>
</html>
